name: Feature request
description: Propose a focused improvement to ParsecDB
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem would this solve, and who would benefit?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and protocol considerations
      description: Note any changes to trust assumptions, leakage, communication, or supported party model.
