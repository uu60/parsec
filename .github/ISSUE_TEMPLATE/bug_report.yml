name: Bug report
description: Report a reproducible problem in ParsecDB
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest example, command, rank count, and configuration needed to reproduce the problem.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: ParsecDB version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler, CMake, MPI implementation, CPU architecture, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
