name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Linux jobs are pinned to Ubuntu 24.04 (GCC 13, Open MPI 4.1) so results are reproducible. ubuntu-latest moved to
# Ubuntu 26.04 with Open MPI 5, whose launcher currently fails to start the three test ranks on hosted runners.
jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: apple-clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenmpi-dev openmpi-bin libssl-dev libboost-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja open-mpi openssl boost

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --parallel 2

      - name: Test
        run: ctest --preset ci

  database-build:
    name: ubuntu / database
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenmpi-dev openmpi-bin libssl-dev libboost-dev libreadline-dev

      - name: Configure
        run: cmake --preset ci-database

      - name: Build
        run: cmake --build --preset ci-database --parallel 2

      - name: Test
        run: ctest --preset ci-database

  latest-toolchain-build:
    # Compile every target with the newest runner toolchain (GCC 15 on Ubuntu 26.04) to catch compiler regressions.
    # Tests are not run here because the Open MPI 5 launcher on this image cannot start the three test ranks yet.
    name: ubuntu-latest / build all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenmpi-dev openmpi-bin libssl-dev libboost-dev libreadline-dev

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel 2

  sanitizers:
    name: ubuntu / sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libopenmpi-dev openmpi-bin libssl-dev libboost-dev

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset ci-sanitizers

      - name: Build
        run: cmake --build --preset ci-sanitizers --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ci-sanitizers
