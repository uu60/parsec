name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: apple-clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: ./.github/actions/setup-ubuntu

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja open-mpi openssl boost

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --parallel 2

      - name: Test
        run: ctest --preset ci

  database-build:
    name: ubuntu / database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-ubuntu

      - name: Configure
        run: cmake --preset ci-database

      - name: Build
        run: cmake --build --preset ci-database --parallel 2

      - name: Test
        run: ctest --preset ci-database

  latest-toolchain-build:
    # Compile every target, including benchmarks and experiments that the test presets skip, to catch compiler
    # regressions with the newest runner toolchain.
    name: ubuntu-latest / build all targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-ubuntu

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel 2

  sanitizers:
    name: ubuntu / sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-ubuntu
        with:
          extra-packages: clang

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset ci-sanitizers

      - name: Build
        run: cmake --build --preset ci-sanitizers --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ci-sanitizers
